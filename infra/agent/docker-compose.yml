services:
  agent:
    build:
      context: ../../apps/agent
      dockerfile: Dockerfile
    image: palhatch-agent:phase0
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:18765:18765"
    environment:
      APP_ENV: ${APP_ENV:-development}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18765/healthz', timeout=2)",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    cpus: "0.50"
    mem_limit: 512m
    pids_limit: 128
