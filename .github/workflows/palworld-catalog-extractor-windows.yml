name: Palworld catalog extractor (Windows)

on:
  pull_request:
    paths:
      - "tools/palworld-catalog-extractor/**"
      - "packages/contracts/data/palworld-stable-id-v1.json"
      - ".github/workflows/palworld-catalog-extractor-windows.yml"
  push:
    branches: [main]
    paths:
      - "tools/palworld-catalog-extractor/**"
      - "packages/contracts/data/palworld-stable-id-v1.json"
      - ".github/workflows/palworld-catalog-extractor-windows.yml"

permissions:
  contents: read

jobs:
  extractor:
    name: .NET 10 x64 synthetic checks
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/palworld-catalog-extractor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore PalworldCatalogExtractor.sln -p:Platform=x64
      - run: dotnet build PalworldCatalogExtractor.sln -c Release -p:Platform=x64 --no-restore
      - run: dotnet test PalworldCatalogExtractor.sln -c Release -p:Platform=x64 --no-build
