name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web and workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: apps/agent/uv.lock
      - run: pnpm install --frozen-lockfile
      - run: uv python install 3.12
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm contracts:generate
      - run: git diff --exit-code -- packages/contracts/src/generated apps/agent/src/pal_hatch_helper/generated
      - run: pnpm build

  database:
    name: Local Supabase database
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: apps/agent/uv.lock
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - run: pnpm install --frozen-lockfile
      - run: uv python install 3.12
      - run: uv sync --frozen --dev
        working-directory: apps/agent
      - run: supabase start
      - run: supabase db reset
      - run: supabase db lint
      - run: supabase test db
      - run: DATABASE_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres' pnpm database:test:concurrency
      - run: DATABASE_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres' pnpm database:types
      - run: git diff --exit-code -- packages/contracts/src/database.types.ts
      - name: Run Agent lifecycle against local Supabase
        run: |
          eval "$(supabase status -o env)"
          export TEST_SUPABASE_URL="$API_URL"
          export TEST_SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}
          cd apps/agent
          uv run pytest -m integration

  phase5-e2e:
    name: Phase 5 browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @palhatch/web exec playwright install --with-deps chromium
      - run: pnpm check:phase5

  agent:
    name: Python Agent
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: apps/agent/uv.lock
      - run: uv python install 3.12
      - run: uv sync --frozen --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest

  repository:
    name: Structure, docs, and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check .
      - run: pnpm check:structure
      - run: pnpm check:forbidden-assets
      - run: pnpm scan:secrets
      - name: Assert required documentation is non-empty
        run: |
          test -s AGENTS.md
          test -s README.md
          test -s docs/superpowers/specs/2026-07-13-palworld-breeding-system-design.md
          test -s docs/superpowers/plans/2026-07-13-palworld-breeding-system-implementation.md
