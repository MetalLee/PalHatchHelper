name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web and workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: apps/agent/uv.lock
      - run: pnpm install --frozen-lockfile
      - run: uv python install 3.12
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm contracts:generate
      - run: git diff --exit-code -- packages/contracts/src/generated apps/agent/src/pal_hatch_helper/generated
      - run: pnpm build

  database:
    name: Local Supabase database
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: apps/agent/uv.lock
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - run: pnpm install --frozen-lockfile
      - run: uv python install 3.12
      - run: uv sync --frozen --dev
        working-directory: apps/agent
      - run: supabase start
      - run: supabase db reset
      - run: supabase db lint
      - run: supabase test db
      - run: DATABASE_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres' pnpm database:test:concurrency
      - run: DATABASE_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres' pnpm database:types
      - run: git diff --exit-code -- packages/contracts/src/database.types.ts
      - name: Run Agent lifecycle against local Supabase
        run: |
          eval "$(supabase status -o env)"
          export TEST_SUPABASE_URL="$API_URL"
          export TEST_SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}
          cd apps/agent
          uv run pytest -m integration

  phase5-e2e:
    name: Phase 5 browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: apps/agent/uv.lock
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - run: pnpm install --frozen-lockfile
      - run: uv python install 3.12
      - run: uv sync --frozen --no-dev
        working-directory: apps/agent
      - run: pnpm --filter @palhatch/web exec playwright install --with-deps chromium
      - run: pnpm check:phase5
        env:
          PHASE5_E2E_GREP_INVERT: ${{ github.event_name == 'pull_request' && 'PalBeacon login and workspace branding stay responsive' || '' }}

  agent:
    name: Python Agent
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: apps/agent/uv.lock
      - run: uv python install 3.12
      - run: uv sync --frozen --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest

  parser-linux-x64:
    name: Parser linux-x64
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PARSER_BUILD_IMAGE: golang@sha256:1ecb7edf62a0408027bd5729dfd6b1b8766e578e8df93995b225dfd0944eb651
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test and vet Parser
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/workspace:ro" \
            -w /workspace/parser \
            "$PARSER_BUILD_IMAGE" \
            sh -eu -c '
              go test -mod=vendor ./...
              go vet ./...
              go test -mod=vendor ./internal/sav -run="^$" -fuzz=FuzzParseContainerHeader -fuzztime=3s
              go test -mod=vendor ./internal/palooz -run="^$" -fuzz=FuzzDecompressBoundaries -fuzztime=3s
            '
      - name: Reproducibly build and inspect Parser
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/workspace:ro" \
            -v "$RUNNER_TEMP:/runner-temp" \
            -w /workspace/parser \
            "$PARSER_BUILD_IMAGE" \
            ./scripts/build-linux-amd64.sh /runner-temp/parser-first
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/workspace:ro" \
            -v "$RUNNER_TEMP:/runner-temp" \
            -w /workspace/parser \
            "$PARSER_BUILD_IMAGE" \
            ./scripts/build-linux-amd64.sh /runner-temp/parser-second
          cmp "$RUNNER_TEMP/parser-first" "$RUNNER_TEMP/parser-second"
          cmp parser/palworld-save-parser "$RUNNER_TEMP/parser-first"
          test "$("$RUNNER_TEMP/parser-first" --version)" = "$(cat parser/VERSION)"
          file "$RUNNER_TEMP/parser-first"
          ldd "$RUNNER_TEMP/parser-first"
          test "$(readelf -d "$RUNNER_TEMP/parser-first" | sed -n 's/.*Shared library: \[\([^]]*\)\].*/\1/p')" = "libc.so.6"
          ! readelf -n "$RUNNER_TEMP/parser-first" | grep -q 'Build ID'
          ! strings "$RUNNER_TEMP/parser-first" | grep -Eq 'Ooz_Compress|CompressBlock'
      - name: Parse the real PlM fixture
        run: |
          mkdir -p "$RUNNER_TEMP/linux-fixture/Players"
          cp data/parser-fixtures/plm-minimal/Level.sav "$RUNNER_TEMP/linux-fixture/Level.sav"
          cp data/parser-fixtures/plm-minimal/Level.sav "$RUNNER_TEMP/linux-fixture/Players/11111111111111111111111111111111.sav"
          touch -d '2026-07-18T16:00:00Z' "$RUNNER_TEMP/linux-fixture/Level.sav" "$RUNNER_TEMP/linux-fixture/Players/11111111111111111111111111111111.sav"
          PALHATCH_WORLD_UID=fixture-world-001 "$RUNNER_TEMP/parser-first" \
            --snapshot "$RUNNER_TEMP/linux-fixture" \
            --output "$RUNNER_TEMP/linux-canonical.json"
          diff \
            <(jq -S . data/parser-fixtures/plm-minimal/expected-canonical.json) \
            <(jq -S . "$RUNNER_TEMP/linux-canonical.json")
      - name: Create Linux artifact metadata
        run: |
          mkdir -p "$RUNNER_TEMP/parser-linux-x64"
          cp "$RUNNER_TEMP/parser-first" "$RUNNER_TEMP/parser-linux-x64/palworld-save-parser"
          node apps/sync/scripts/create-parser-manifest.mjs \
            linux-x64 \
            "$RUNNER_TEMP/parser-linux-x64/palworld-save-parser" \
            "$RUNNER_TEMP/parser-linux-x64/parser-manifest.json"
          sha256sum "$RUNNER_TEMP/parser-linux-x64/palworld-save-parser" \
            > "$RUNNER_TEMP/parser-linux-x64/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: parser-linux-x64
          path: ${{ runner.temp }}/parser-linux-x64
          if-no-files-found: error
          retention-days: 14

  parser-win32-x64:
    name: Parser win32-x64
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the pinned MinGW-w64 environment
        run: |
          docker build \
            -f parser/Dockerfile.windows-amd64 \
            -t palbeacon-parser-windows-amd64 .
      - name: Reproducibly cross-compile and inspect Parser
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/workspace:ro" \
            -v "$RUNNER_TEMP:/runner-temp" \
            -w /workspace/parser \
            palbeacon-parser-windows-amd64 \
            ./scripts/build-windows-amd64.sh /runner-temp/parser-first.exe
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/workspace:ro" \
            -v "$RUNNER_TEMP:/runner-temp" \
            -w /workspace/parser \
            palbeacon-parser-windows-amd64 \
            ./scripts/build-windows-amd64.sh /runner-temp/parser-second.exe
          cmp "$RUNNER_TEMP/parser-first.exe" "$RUNNER_TEMP/parser-second.exe"
          file "$RUNNER_TEMP/parser-first.exe" | grep -E 'PE32\+ executable.*x86-64'
          docker run --rm \
            -v "$RUNNER_TEMP:/runner-temp:ro" \
            palbeacon-parser-windows-amd64 \
            x86_64-w64-mingw32-objdump -p /runner-temp/parser-first.exe \
            > "$RUNNER_TEMP/windows-objdump.txt"
          ! grep -Eiq 'DLL Name: (libstdc\+\+-6|libgcc_s_seh-1|libwinpthread-1|winhttp|wininet)\.dll' \
            "$RUNNER_TEMP/windows-objdump.txt"
          ! strings "$RUNNER_TEMP/parser-first.exe" | grep -Eq 'Ooz_Compress|CompressBlock'
      - name: Create Windows artifact metadata
        run: |
          mkdir -p "$RUNNER_TEMP/parser-win32-x64"
          cp "$RUNNER_TEMP/parser-first.exe" "$RUNNER_TEMP/parser-win32-x64/palworld-save-parser.exe"
          cp "$RUNNER_TEMP/windows-objdump.txt" "$RUNNER_TEMP/parser-win32-x64/PE-IMPORTS.txt"
          node apps/sync/scripts/create-parser-manifest.mjs \
            win32-x64 \
            "$RUNNER_TEMP/parser-win32-x64/palworld-save-parser.exe" \
            "$RUNNER_TEMP/parser-win32-x64/parser-manifest.json"
          sha256sum "$RUNNER_TEMP/parser-win32-x64/palworld-save-parser.exe" \
            > "$RUNNER_TEMP/parser-win32-x64/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: parser-win32-x64
          path: ${{ runner.temp }}/parser-win32-x64
          if-no-files-found: error
          retention-days: 14

  package-palbeacon-cli:
    name: Package palbeacon-cli
    needs: [parser-linux-x64, parser-win32-x64]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: parser-linux-x64
          path: ${{ runner.temp }}/parser-linux-x64
      - uses: actions/download-artifact@v4
        with:
          name: parser-win32-x64
          path: ${{ runner.temp }}/parser-win32-x64
      - name: Test and build Sync CLI
        run: |
          pnpm --filter palbeacon-cli lint
          pnpm --filter palbeacon-cli typecheck
          pnpm --filter palbeacon-cli test
          pnpm --filter palbeacon-cli build
          pnpm check:parser-version
      - name: Build the one cross-platform npm candidate
        working-directory: apps/sync
        env:
          PALBEACON_PARSER_LINUX_X64: ${{ runner.temp }}/parser-linux-x64/palworld-save-parser
          PALBEACON_PARSER_LINUX_X64_MANIFEST: ${{ runner.temp }}/parser-linux-x64/parser-manifest.json
          PALBEACON_PARSER_WIN32_X64: ${{ runner.temp }}/parser-win32-x64/palworld-save-parser.exe
          PALBEACON_PARSER_WIN32_X64_MANIFEST: ${{ runner.temp }}/parser-win32-x64/parser-manifest.json
        run: |
          npm pack --dry-run
          tarball="$(npm pack --silent)"
          expected_tarball="$(node -p "const p = require('./package.json'); p.name + '-' + p.version + '.tgz'")"
          test "$tarball" = "$expected_tarball"
          node scripts/verify-package.mjs "$tarball" --structure-only \
            > "$RUNNER_TEMP/package-structure-verification.json"
          mkdir -p "$RUNNER_TEMP/palbeacon-cli-candidate"
          cp "$tarball" "$RUNNER_TEMP/palbeacon-cli-candidate/"
          cp "$RUNNER_TEMP/package-structure-verification.json" \
            "$RUNNER_TEMP/palbeacon-cli-candidate/"
          sha256sum "$tarball" \
            > "$RUNNER_TEMP/palbeacon-cli-candidate/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: palbeacon-cli-candidate
          path: ${{ runner.temp }}/palbeacon-cli-candidate
          if-no-files-found: error
          retention-days: 14

  test-palbeacon-cli:
    name: Test palbeacon-cli (${{ matrix.os }})
    needs: package-palbeacon-cli
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter palbeacon-cli test
      - uses: actions/download-artifact@v4
        with:
          name: palbeacon-cli-candidate
          path: ${{ runner.temp }}/palbeacon-cli-candidate
      - name: Install and test the Linux runtime
        if: runner.os == 'Linux'
        run: |
          tarball="$(node -p "const p = require('./apps/sync/package.json'); p.name + '-' + p.version + '.tgz'")"
          node apps/sync/scripts/verify-package.mjs \
            "$RUNNER_TEMP/palbeacon-cli-candidate/$tarball" \
            --runtime-only
      - name: Install and test the Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tarball = node -p "const p = require('./apps/sync/package.json'); p.name + '-' + p.version + '.tgz'"
          node apps/sync/scripts/verify-package.mjs `
            "$env:RUNNER_TEMP\palbeacon-cli-candidate\$tarball" `
            --runtime-only

  repository:
    name: Structure, docs, and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check .
      - run: pnpm test:production-backup
      - run: pnpm test:production-data
      - run: pnpm test:production-deploy
      - run: pnpm check:structure
      - run: pnpm check:forbidden-assets
      - run: pnpm scan:secrets
      - name: Assert required documentation is non-empty
        run: |
          test -s AGENTS.md
          test -s README.md
          test -s docs/superpowers/specs/2026-07-13-palworld-breeding-system-design.md
          test -s docs/superpowers/plans/2026-07-13-palworld-breeding-system-implementation.md
