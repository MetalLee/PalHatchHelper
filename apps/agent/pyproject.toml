[project]
name = "pal-hatch-helper-agent"
version = "0.0.0"
description = "Private PalHatch Helper server agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.119.1",
  "httpx==0.28.1",
  "pydantic==2.12.3",
  "pydantic-settings==2.11.0",
  "uvicorn[standard]==0.38.0",
  "zstandard==0.25.0",
]

[dependency-groups]
dev = [
  "jsonschema==4.25.1",
  "mypy==1.18.2",
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
  "ruff==0.14.2",
]

[project.scripts]
pal-hatch-helper = "pal_hatch_helper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pal_hatch_helper"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: requires a reset local Supabase instance on a loopback URL",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
